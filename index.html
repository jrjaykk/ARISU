<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARISU | Advanced Intelligent System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header>
            <h1>ARISU</h1>
            <p>ADVANCED INTELLIGENT SYSTEM</p>
        </header>

        <div class="system-status">
            <span class="status-light"></span>
            <span id="status">SYSTEM ONLINE</span>
        </div>

      <div class="reactor">
    <div class="reactor-ring">

        <div class="logo-orbit orbit-1"></div>
        <div class="logo-orbit orbit-2"></div>

        <div class="reactor-core">

            <svg class="arisu-logo" viewBox="0 0 100 100">
                <!-- Futuristic A -->
                <path
                    d="M50 12 L30 82 L43 82 L50 57 L57 82 L70 82 Z"
                    fill="currentColor"
                />

                <!-- Inner cut -->
                <path
                    d="M44 58 L50 37 L56 58 Z"
                    fill="#07121d"
                />

                <!-- Orbit -->
                <ellipse
                    cx="50"
                    cy="50"
                    rx="35"
                    ry="12"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="4"
                    transform="rotate(-12 50 50)"
                />
            </svg>

        </div>
    </div>
</div>

   <div class="chat-box" id="chatBox">

    <div class="message arisu-message">
        <div class="message-name">ARISU</div>
        <div class="message-text">
            Hello. I am ARISU.<br>
            How may I assist you?
        </div>
    </div>

</div>

        <div class="command-area">

            <input
                type="text"
                id="commandInput"
                placeholder="Type a command..."
                autocomplete="off"
            >

            <button id="sendBtn">SEND</button>

        </div>
        <button id="clearChatBtn" class="clear-chat">
    CLEAR CHAT
</button>

        <button id="micBtn" class="mic-button">
            🎤
        </button>

        <p class="mic-text">Click microphone to speak</p>

        <footer>
            ARISU v1.0 • Personal AI Assistant
        </footer>

    </div>

    <script src="commands.js"></script>
    <script src="script.js"></script>

</body>
</html>
