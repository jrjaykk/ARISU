<body>
    <div id="authScreen">

            <p>ADVANCED INTELLIGENT SYSTEM</p>
        </header>
       <div class="profile-bar">

    <button id="profileBtn">👤 PROFILE</button>

    <button id="logoutBtn">🚪 LOGOUT</button>

</div>

        <div class="system-status">
            <span class="status-light"></span>
            <span id="status">SYSTEM ONLINE</span>
        </div>

      <div class="reactor">
    <div class="reactor-ring">

        <div class="logo-orbit orbit-1"></div>
        <div class="logo-orbit orbit-2"></div>

        <div class="reactor-core">

            <svg class="arisu-logo" viewBox="0 0 100 100">
                <!-- Futuristic A -->
                <path
                    d="M50 12 L30 82 L43 82 L50 57 L57 82 L70 82 Z"
                    fill="currentColor"
                />

                <!-- Inner cut -->
                <path
                    d="M44 58 L50 37 L56 58 Z"
                    fill="#07121d"
                />

                <!-- Orbit -->
                <ellipse
                    cx="50"
                    cy="50"
                    rx="35"
                    ry="12"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="4"
                    transform="rotate(-12 50 50)"
                />
            </svg>

        </div>
    </div>
</div>

   <div class="chat-box" id="chatBox">

    <div class="message arisu-message">
        <div class="message-name">ARISU</div>
        <div class="message-text">
            Hello. I am ARISU.<br>
            How may I assist you?
        </div>
    </div>

</div>

        <div class="command-area">

            <input
                type="text"
                id="commandInput"
                placeholder="Type a command..."
                autocomplete="off"
            >

            <button id="sendBtn">SEND</button>

        </div>
        <button id="clearChatBtn" class="clear-chat">
    CLEAR CHAT
</button>
        <button id="voiceToggleBtn">🔊 Voice ON</button>
        

        <button id="micBtn" class="mic-button">
            🎤
        </button>

        <p class="mic-text">Click microphone to speak</p>

        <footer>
            ARISU v1.0 • Personal AI Assistant
        </footer>

    </div>

    <script>
const SUPABASE_URL = "https://iupocrcesxpwlqikqvxj.supabase.co";
const SUPABASE_KEY = "sb_publishable_MvOgyVh8sEPQHn5BRs15UQ_CD-Dq17b";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY

    <script>
const signUpBtn = document.getElementById("signUpBtn");
const loginBtn = document.getElementById("loginBtn");

const emailInput = document.getElementById("emailInput");
const passwordInput = document.getElementById("passwordInput");
const authMessage = document.getElementById("authMessage");

signUpBtn.addEventListener("click", async function() {

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (email === "" || password === "") {
        authMessage.innerText = "Please enter email and password.";
        return;
    }

    const result = await supabaseClient.auth.signUp({
        email: email,
        password: password
    });

    if (result.error) {
        authMessage.innerText = result.error.message;
        return;
    }

    authMessage.innerText =
        "Account created. Check your email to confirm your account.";

});

loginBtn.addEventListener("click", async function() {

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (email === "" || password === "") {
        authMessage.innerText = "Please enter email and password.";
        return;
    }

    const result = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (result.error) {
        authMessage.innerText = result.error.message;
        return;
    }

    authMessage.innerText = "Login successful.";

});
        
</script>

       <script>
async function checkLogin() {

    const result = await supabaseClient.auth.getSession();
    const session = result.data.session;

    if (session) {
        authScreen.style.display = "none";
        arisuApp.style.display = "block";
    } else {
        authScreen.style.display = "block";
        arisuApp.style.display = "none";
    }
}

checkLogin();

loginBtn.addEventListener("click", function() {
    setTimeout(checkLogin, 500);
});
</script>
<script>

const profileBtn = document.getElementById("profileBtn");
const logoutBtn = document.getElementById("logoutBtn");

profileBtn.addEventListener("click", async function() {

    const result = await supabaseClient.auth.getUser();

    if (result.error || !result.data.user) {
        return;
    }

    const user = result.data.user;

    alert(
        "ARISU PROFILE\n\n" +
        "Email: " + user.email
    );

});

logoutBtn.addEventListener("click", async function() {

    const result = await supabaseClient.auth.signOut();

    if (result.error) {
        alert("Logout failed.");
        return;
    }

    arisuApp.style.display = "none";
    authScreen.style.display = "block";

});

</script>
