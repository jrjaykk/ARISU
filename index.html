    <script>
const signUpBtn = document.getElementById("signUpBtn");
const loginBtn = document.getElementById("loginBtn");

const emailInput = document.getElementById("emailInput");
const passwordInput = document.getElementById("passwordInput");
const authMessage = document.getElementById("authMessage");

        const togglePasswordBtn =
    document.getElementById("togglePasswordBtn");

togglePasswordBtn.addEventListener(
    "click",
    function() {

        if (passwordInput.type === "password") {

            passwordInput.type = "text";
            togglePasswordBtn.innerText = "🙈";

        } else {

            passwordInput.type = "password";
            togglePasswordBtn.innerText = "👁";

        }

    }
);

signUpBtn.addEventListener("click", async function() {

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (email === "" || password === "") {
        authMessage.innerText = "Please enter email and password.";
        return;
    }

    const result = await supabaseClient.auth.signUp({
        email: email,
        password: password
    });

    if (result.error) {
        authMessage.innerText = result.error.message;
        return;
    }

    authMessage.innerText =
        "Account created. Check your email to confirm your account.";

});

loginBtn.addEventListener("click", async function() {

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (email === "" || password === "") {
        authMessage.innerText = "Please enter email and password.";
        return;
    }

    const result = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (result.error) {
        authMessage.innerText = result.error.message;
        return;
    }

    authMessage.innerText = "Login successful.";

});
        
</script>

<script>

const profileBtn = document.getElementById("profileBtn");
const logoutBtn = document.getElementById("logoutBtn");

const profilePanel = document.getElementById("profilePanel");
const closeProfileBtn = document.getElementById("closeProfileBtn");

const profileEmail = document.getElementById("profileEmail");
const memoryList = document.getElementById("memoryList");


// ==========================================
// OPEN PROFILE
// ==========================================

profileBtn.addEventListener("click", async function() {

    profilePanel.style.display = "block";

    profileEmail.innerText = "Loading...";
    memoryList.innerHTML = "<p>Loading memories...</p>";


    // Get current user

    const result =
        await supabaseClient.auth.getUser();


    if (result.error || !result.data.user) {

        profileEmail.innerText = "Not logged in";
        memoryList.innerHTML = "<p>Please login first.</p>";

        return;
    }


    const user = result.data.user;


    // Show email

    profileEmail.innerText =
        user.email;


    // Load memories

    const memoryResult =
        await supabaseClient
            .from("memories")
            .select("id, memory, created_at")
            .eq("user_id", user.id)
            .order("created_at", {
                ascending: false
            });


    if (memoryResult.error) {

        console.error(
            "MEMORY LOAD ERROR:",
            memoryResult.error
        );

        memoryList.innerHTML =
            "<p>Unable to load memories.</p>";

        return;
    }


    const memories =
        memoryResult.data || [];


    // No memories

    if (memories.length === 0) {

        memoryList.innerHTML =
            "<p>No memories saved yet.</p>";

        return;
    }


    // Display memories

    memoryList.innerHTML = "";


    memories.forEach(function(item) {

        const memoryDiv =
            document.createElement("div");

        memoryDiv.className =
            "memory-item";


        const memoryText =
            document.createElement("span");

        memoryText.innerText =
            "🧠 " + item.memory;


        const deleteBtn =
            document.createElement("button");

        deleteBtn.innerText =
            "DELETE";


        deleteBtn.addEventListener(
            "click",
            async function() {

                const deleteResult =
                    await supabaseClient
                        .from("memories")
                        .delete()
                        .eq("id", item.id)
                        .eq("user_id", user.id);


                if (deleteResult.error) {

                    alert(
                        "Unable to delete memory."
                    );

                    return;
                }


                // Refresh memories

                profileBtn.click();

            }
        );


        memoryDiv.appendChild(memoryText);
        memoryDiv.appendChild(deleteBtn);

        memoryList.appendChild(memoryDiv);

    });

});


// ==========================================
// CLOSE PROFILE
// ==========================================

closeProfileBtn.addEventListener(
    "click",
    function() {

        profilePanel.style.display = "none";

    }
);


// ==========================================
// LOGOUT
// ==========================================

logoutBtn.addEventListener(
    "click",
    async function() {

        const result =
            await supabaseClient.auth.signOut();


        if (result.error) {

            alert("Logout failed.");

            return;
        }


        profilePanel.style.display = "none";

        arisuApp.style.display = "none";

        authScreen.style.display = "flex";

    }
);

const profileNewChatBtn =
    document.getElementById("profileNewChatBtn");

const profileHistoryBtn =
    document.getElementById("profileHistoryBtn");


/* ==========================================
   PROFILE → NEW CHAT
========================================== */

profileNewChatBtn.addEventListener(
    "click",
    async function() {

        profilePanel.style.display = "none";

        if (typeof createNewChat === "function") {
            await createNewChat();
        }

    }
);


/* ==========================================
   PROFILE → CHAT HISTORY
========================================== */

profileHistoryBtn.addEventListener(
    "click",
    function() {

        profilePanel.style.display = "none";

        const sidebar =
            document.getElementById("arisuSidebar");

        if (sidebar) {

            sidebar.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

        }

    }
);
</script>
